name: Publish WRW
run-name: ${{ github.event_name == 'workflow_dispatch' && format('WRW {0}', inputs.release_tag) || 'WRW publication checks' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable public release asset tag
        required: true
        type: string
      release_id:
        description: Verified WRW release SHA-256
        required: true
        type: string
      archive_sha256:
        description: Expected archive SHA-256
        required: true
        type: string
      transport:
        description: Immutable transport format
        required: false
        default: archive
        type: choice
        options: [archive, layers]

permissions:
  contents: read

concurrency:
  group: wrw-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Download and verify exact public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ID: ${{ inputs.release_id }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          TRANSPORT: ${{ inputs.transport || 'archive' }}
        run: |
          python -c 'import os,re; assert re.fullmatch(r"wrw-[a-f0-9]{64}",os.environ["RELEASE_TAG"]); assert re.fullmatch(r"[a-f0-9]{64}",os.environ["RELEASE_ID"]); assert re.fullmatch(r"[a-f0-9]{64}",os.environ["ARCHIVE_SHA256"])'
          if [ "$TRANSPORT" = layers ]; then
            gh release download "$RELEASE_TAG" --pattern delivery.json --dir incoming
            python scripts/wrw_layers.py incoming/delivery.json --output public-site --release-id "$RELEASE_ID" --sha256 "$ARCHIVE_SHA256" --repo "$GITHUB_REPOSITORY"
          elif [ "$TRANSPORT" = archive ]; then
            gh release download "$RELEASE_TAG" --pattern wrw-site.tar.gz --dir incoming
            python scripts/wrw_pages_bundle.py verify incoming/wrw-site.tar.gz --output public-site --release-id "$RELEASE_ID" --sha256 "$ARCHIVE_SHA256"
          else
            echo 'Unknown transport' >&2
            exit 1
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public-site
          retention-days: 1
          include-hidden-files: true
      - name: Fence superseded layered publication
        if: inputs.transport == 'layers'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ inputs.archive_sha256 }}
          PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/publication-request.json?ref=main" --jq .content | base64 --decode > incoming/current-request.json
          python -c 'import os,sys; sys.path.insert(0,"scripts"); from wrw_layers import check_dispatch; check_dispatch("incoming/delivery.json",os.environ["EXPECTED_SHA256"],"incoming/current-request.json",os.environ["PUBLIC_URL"])'
      - name: Deploy exact verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Check deployed marker, articles, assets and 404
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
          TRANSPORT: ${{ inputs.transport || 'archive' }}
        run: |
          if [ "$TRANSPORT" = layers ]; then
            python scripts/wrw_verify_live.py --delivery incoming/delivery.json --url "$PUBLIC_URL"
          else
            python scripts/wrw_verify_live.py --archive incoming/wrw-site.tar.gz --url "$PUBLIC_URL"
          fi
      - name: Remove transient Pages artifact after deployment
        if: always() && steps.deployment.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' |
          while IFS= read -r artifact_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
